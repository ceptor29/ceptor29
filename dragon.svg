<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A020F0"/>
      <stop offset="100%" stop-color="#6B00B3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- body coil -->
    <path d="M40 160 C 80 80, 160 240, 200 120"/>
    <!-- head -->
    <path d="M180 110 q 20 -20 40 -10 q 8 12 -4 20 q -16 4 -22 -2 z"/>
    <!-- eye -->
    <circle cx="204" cy="118" r="2.5" fill="#E0C3FC" stroke="none"/>
    <!-- horns -->
    <path d="M196 96 l -6 -14"/>
    <path d="M208 92 l 6 -16"/>
    <!-- spikes along back -->
    <path d="M70 140 l 4 -10"/>
    <path d="M100 130 l 4 -12"/>
    <path d="M130 138 l 4 -14"/>
    <path d="M160 140 l 4 -12"/>
    <!-- tail tip -->
    <path d="M40 160 q -16 -4 -22 8 q 4 8 14 6"/>
    <!-- wing -->
    <path d="M120 80 q 30 -30 70 -20 q -10 14 -36 22"/>
    <path d="M120 80 q -10 -20 -38 -22 q 6 12 24 22"/>
  </g>
</svg>